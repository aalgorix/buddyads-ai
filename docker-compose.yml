services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: buddyads
      POSTGRES_PASSWORD: buddyads
      POSTGRES_DB: buddyads
    ports:
      - "5432:5432"
    volumes:
      - buddyads_pg:/var/lib/postgresql/data

volumes:
  buddyads_pg:
